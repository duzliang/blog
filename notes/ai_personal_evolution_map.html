let expandedCard = null;
let currentCat = 0;

function init() {
  const tabBar = document.getElementById('tab-bar');
  categories.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = cat.label;
    btn.onclick = () => showCategory(i);
    tabBar.appendChild(btn);
  });
  renderMethods(0);
}

function showCategory(idx) {
  currentCat = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  expandedCard = null;
  renderMethods(idx);
}

function renderMethods(idx) {
  const cat = categories[idx];
  const area = document.getElementById('content-area');
  area.innerHTML = cat.methods.map((m, i) => `
    <div class="method-card" id="card-${i}" onclick="toggleCard(${i})">
      <div class="card-header">
        <span class="card-icon">${m.icon}</span>
        <div class="card-body">
          <div class="card-title">
            <span class="card-title-text">${m.title}</span>
            <span class="tag" style="background:${m.tagColor};color:${m.tagText}">${m.tag}</span>
          </div>
          <p class="card-summary">${m.summary}</p>
        </div>
        <span class="card-arrow" id="arrow-${i}">▼</span>
      </div>
      <div class="card-detail" id="detail-${i}">
        <p>${m.detail}</p>
        <button class="try-btn" onclick="event.stopPropagation();copyPrompt(this, '${encodeURIComponent(m.prompt)}')">复制提示词 ↗</button>
        <span class="copy-feedback" id="feedback-${i}">已复制！</span>
      </div>
    </div>
  `).join('');
}

function toggleCard(i) {
  const detail = document.getElementById('detail-' + i);
  const arrow = document.getElementById('arrow-' + i);
  const card = document.getElementById('card-' + i);
  const isOpen = detail.style.display === 'block';
  if (expandedCard !== null && expandedCard !== i) {
    document.getElementById('detail-' + expandedCard).style.display = 'none';
    document.getElementById('arrow-' + expandedCard).textContent = '▼';
    document.getElementById('card-' + expandedCard).classList.remove('expanded');
  }
  detail.style.display = isOpen ? 'none' : 'block';
  arrow.textContent = isOpen ? '▼' : '▲';
  card.classList.toggle('expanded', !isOpen);
  expandedCard = isOpen ? null : i;
}

function copyPrompt(btn, encoded) {
  const text = decodeURIComponent(encoded);
  navigator.clipboard.writeText(text).then(() => {
    const i = btn.closest('.method-card').id.replace('card-', '');
    const fb = document.getElementById('feedback-' + i);
    fb.classList.add('show');
    setTimeout(() => fb.classList.remove('show'), 2000);
  });
}

init();
</script>
