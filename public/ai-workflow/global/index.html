<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 时代开发工作流</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

  :root {
    --ink: #2C2C2C;
    --border: #2C2C2C;
    --border-w: 3px;
    --shadow-x: 4px;
    --shadow-y: 4px;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-lg: 20px;
    --bg-base: #FFF9F0;
    --bg-card: #FFFFFF;
    --bg-pink: #FFF0F6;
    --bg-green: #F0FFF4;
    --bg-blue: #F0F8FF;
    --bg-yellow: #FFFAF0;
    --green: #52C41A;
    --green-dark: #237804;
    --yellow: #FFD93D;
    --red: #FA5252;
    --blue: #4DABF7;
    --font: 'Baloo 2', 'Noto Sans SC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg-base);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== Illustration Box ========== */
  .illu-box {
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
    box-shadow: var(--shadow-x) var(--shadow-y) 0 var(--border);
    transition: all 0.2s ease;
  }
  .illu-box:hover {
    box-shadow: 6px 6px 0 var(--border);
    transform: translate(-1px, -1px);
  }
  .illu-box-sm {
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: 2px 2px 0 var(--border);
  }

  /* ========== 顶部导航 ========== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg-base);
    border-bottom: var(--border-w) solid var(--border);
    box-shadow: 0 3px 0 var(--border);
    padding: 0 24px;
  }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .topbar-brand {
    font-size: 1.3rem; font-weight: 800; color: var(--ink);
    text-decoration: none; display: flex; align-items: center; gap: 10px;
    letter-spacing: -0.02em;
  }
  .topbar-brand .logo {
    width: 40px; height: 40px;
    background: var(--green); border: var(--border-w) solid var(--border);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 800; color: white;
    box-shadow: 2px 2px 0 var(--border);
  }
  .topbar-links { display: flex; gap: 6px; }
  .topbar-link {
    padding: 8px 16px; border-radius: var(--radius-sm);
    font-weight: 600; font-size: 0.9rem; color: var(--ink);
    text-decoration: none; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .topbar-link:hover, .topbar-link.active {
    background: var(--ink); color: white;
  }
  .topbar-badge {
    background: var(--yellow); color: var(--ink);
    font-size: 0.65rem; font-weight: 800; padding: 2px 7px;
    border-radius: 20px; border: 2px solid var(--border);
    margin-left: 4px;
  }

  /* ========== Hero ========== */
  .hero {
    max-width: 1200px; margin: 0 auto;
    padding: 60px 24px 40px;
    display: flex; align-items: center; gap: 48px;
  }
  .hero-text { flex: 1; }
  .hero-text h1 {
    font-size: 2.8rem; font-weight: 800; line-height: 1.1;
    color: var(--ink); letter-spacing: -0.03em;
    margin-bottom: 16px;
  }
  .hero-text h1 .highlight {
    background: var(--yellow); padding: 0 8px;
    border: var(--border-w) solid var(--border);
    border-radius: 8px; display: inline-block;
  }
  .hero-text p {
    font-size: 1.1rem; color: #555; font-weight: 500;
    margin-bottom: 24px; max-width: 480px;
  }
  .hero-btns { display: flex; gap: 12px; }
  .btn-illu {
    padding: 12px 28px; border-radius: var(--radius-sm);
    font-weight: 700; font-size: 0.95rem; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px;
    border: var(--border-w) solid var(--border);
    transition: all 0.15s; text-decoration: none; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .btn-illu.primary {
    background: var(--green); color: white;
    box-shadow: var(--shadow-x) var(--shadow-y) 0 var(--border);
  }
  .btn-illu.primary:hover { box-shadow: 6px 6px 0 var(--border); transform: translate(-1px,-1px); }
  .btn-illu.ghost {
    background: var(--bg-card); color: var(--ink);
    box-shadow: var(--shadow-x) var(--shadow-y) 0 var(--border);
  }
  .btn-illu.ghost:hover { box-shadow: 6px 6px 0 var(--border); transform: translate(-1px,-1px); }

  /* Hero illustration */
  .hero-illust {
    flex: 0 0 360px; position: relative;
  }
  .hero-illust svg { width: 100%; }
  .illo-circle {
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ========== Section ========== */
  .section { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
  .section-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px; padding-bottom: 16px;
    border-bottom: var(--border-w) solid var(--border);
  }
  .section-head h2 {
    font-size: 1.6rem; font-weight: 800; color: var(--ink);
    letter-spacing: -0.02em;
  }
  .section-head .tag {
    background: var(--yellow); padding: 2px 12px;
    border-radius: 20px; font-size: 0.75rem; font-weight: 800;
    border: 2px solid var(--border);
  }

  /* ========== Pipeline ========== */
  .pipeline-wrap { position: relative; }
  .pipeline-track {
    position: absolute; left: 28px; top: 0; bottom: 0;
    width: 4px; border-radius: 2px;
    background: #D0C8B8;
  }
  .stage-card {
    position: relative; padding: 0 0 32px 72px; cursor: pointer;
  }
  .stage-dot {
    position: absolute; left: 16px; top: 6px;
    width: 28px; height: 28px; border-radius: 50%;
    border: var(--border-w) solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; z-index: 2;
    transition: all 0.3s ease;
  }
  .stage-dot.green { background: var(--green); color: white; }
  .stage-dot.blue { background: var(--blue); color: white; }
  .stage-dot.yellow { background: var(--yellow); color: var(--ink); }
  .stage-dot.red { background: var(--red); color: white; }

  /* Spotlight glow for active dot */
  .stage-card.expanded .stage-dot {
    width: 34px; height: 34px; left: 13px; top: 3px;
    border-width: 3px;
    z-index: 5;
  }
  .stage-card.expanded .stage-dot.green {
    box-shadow: 0 0 12px 4px rgba(82,196,26,0.5), 0 0 30px 8px rgba(82,196,26,0.2), 0 4px 20px 4px rgba(82,196,26,0.3), 0 -4px 20px 4px rgba(82,196,26,0.3);
    animation: dotPulseGreen 2s ease-in-out infinite;
  }
  .stage-card.expanded .stage-dot.blue {
    box-shadow: 0 0 12px 4px rgba(77,171,247,0.5), 0 0 30px 8px rgba(77,171,247,0.2), 0 4px 20px 4px rgba(77,171,247,0.3), 0 -4px 20px 4px rgba(77,171,247,0.3);
    animation: dotPulseBlue 2s ease-in-out infinite;
  }
  .stage-card.expanded .stage-dot.yellow {
    box-shadow: 0 0 12px 4px rgba(255,217,61,0.5), 0 0 30px 8px rgba(255,217,61,0.2), 0 4px 20px 4px rgba(255,217,61,0.3), 0 -4px 20px 4px rgba(255,217,61,0.3);
    animation: dotPulseYellow 2s ease-in-out infinite;
  }
  .stage-card.expanded .stage-dot.red {
    box-shadow: 0 0 12px 4px rgba(250,82,82,0.5), 0 0 30px 8px rgba(250,82,82,0.2), 0 4px 20px 4px rgba(250,82,82,0.3), 0 -4px 20px 4px rgba(250,82,82,0.3);
    animation: dotPulseRed 2s ease-in-out infinite;
  }

  @keyframes dotPulseGreen {
    0%, 100% { box-shadow: 0 0 12px 4px rgba(82,196,26,0.5), 0 0 30px 8px rgba(82,196,26,0.2), 0 4px 20px 4px rgba(82,196,26,0.25), 0 -4px 20px 4px rgba(82,196,26,0.25); }
    50% { box-shadow: 0 0 18px 6px rgba(82,196,26,0.6), 0 0 40px 12px rgba(82,196,26,0.3), 0 6px 30px 6px rgba(82,196,26,0.35), 0 -6px 30px 6px rgba(82,196,26,0.35); }
  }
  @keyframes dotPulseBlue {
    0%, 100% { box-shadow: 0 0 12px 4px rgba(77,171,247,0.5), 0 0 30px 8px rgba(77,171,247,0.2), 0 4px 20px 4px rgba(77,171,247,0.25), 0 -4px 20px 4px rgba(77,171,247,0.25); }
    50% { box-shadow: 0 0 18px 6px rgba(77,171,247,0.6), 0 0 40px 12px rgba(77,171,247,0.3), 0 6px 30px 6px rgba(77,171,247,0.35), 0 -6px 30px 6px rgba(77,171,247,0.35); }
  }
  @keyframes dotPulseYellow {
    0%, 100% { box-shadow: 0 0 12px 4px rgba(255,217,61,0.5), 0 0 30px 8px rgba(255,217,61,0.2), 0 4px 20px 4px rgba(255,217,61,0.25), 0 -4px 20px 4px rgba(255,217,61,0.25); }
    50% { box-shadow: 0 0 18px 6px rgba(255,217,61,0.6), 0 0 40px 12px rgba(255,217,61,0.3), 0 6px 30px 6px rgba(255,217,61,0.35), 0 -6px 30px 6px rgba(255,217,61,0.35); }
  }
  @keyframes dotPulseRed {
    0%, 100% { box-shadow: 0 0 12px 4px rgba(250,82,82,0.5), 0 0 30px 8px rgba(250,82,82,0.2), 0 4px 20px 4px rgba(250,82,82,0.25), 0 -4px 20px 4px rgba(250,82,82,0.25); }
    50% { box-shadow: 0 0 18px 6px rgba(250,82,82,0.6), 0 0 40px 12px rgba(250,82,82,0.3), 0 6px 30px 6px rgba(250,82,82,0.35), 0 -6px 30px 6px rgba(250,82,82,0.35); }
  }

  /* Spotlight cone on expanded card body */
  .stage-card .card-body {
    padding: 20px 24px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .stage-card .card-body::before {
    content: '';
    position: absolute;
    left: -24px; top: 50%;
    width: 60px; height: 60px;
    border-radius: 50%;
    transform: translateY(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, width 0.5s ease, height 0.5s ease;
  }
  .stage-card.expanded .card-body::before {
    opacity: 1;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(var(--spot-color, 82,196,26),0.08) 0%, transparent 70%);
  }
  .stage-card.expanded .card-body:hover::before { opacity: 0; }

  /* Spotlight cone overlay on expanded detail */
  .stage-detail {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    border: var(--border-w) solid transparent;
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--bg-pink);
    padding: 0 24px;
    box-shadow: 4px 4px 0 var(--border);
    margin-top: -1px;
    position: relative;
    transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.35s ease,
                padding 0.4s ease,
                border-color 0.3s ease;
  }
  /* Spotlight cone from timeline side */
  .stage-detail::after {
    content: '';
    position: absolute;
    left: -24px; top: -10px;
    width: 160px; height: 100%;
    background: radial-gradient(ellipse at 0% 50%, rgba(var(--spot-color, 82,196,26),0.07) 0%, transparent 80%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 0.15s;
  }
  /* Spotlight radial glow inside detail */
  .stage-detail::before {
    content: '';
    position: absolute;
    left: -40px; top: -20px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--spot-color, 82,196,26),0.06) 0%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease 0.2s;
  }
  .stage-card.expanded .stage-detail {
    max-height: 600px;
    opacity: 1;
    padding: 20px 24px;
    border-color: var(--border);
  }
  .stage-card.expanded .stage-detail::before {
    opacity: 1;
  }
  .stage-card.expanded .stage-detail::after {
    opacity: 1;
  }
  .stage-card .card-body:hover {
    box-shadow: 6px 6px 0 var(--border);
    transform: translate(-1px, -1px);
  }
  .stage-toggle {
    flex-shrink: 0; width: 32px; height: 32px;
    border-radius: 50%; border: var(--border-w) solid var(--border);
    background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 800;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  }
  .stage-card.expanded .stage-toggle {
    transform: rotate(90deg);
    background: var(--yellow);
  }
  .stage-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .stage-top .stage-id {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.05em;
    text-transform: uppercase; color: #888;
  }
  .stage-top h3 { font-size: 1.15rem; font-weight: 800; color: var(--ink); }
  .stage-desc { font-size: 0.92rem; color: #666; font-weight: 500; }
  .stage-card.expanded .card-body {
    border-radius: var(--radius) var(--radius) 0 0;
    box-shadow: 4px 4px 0 var(--border);
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .detail-block {
    padding: 14px 18px;
  }
  /* Vertical center line */
  .detail-block:nth-child(2n-1) {
    border-right: 1px dashed #D0C8B8;
  }
  /* Horizontal center line */
  .detail-block:nth-child(1),
  .detail-block:nth-child(2) {
    border-bottom: 1px dashed #D0C8B8;
  }
  .detail-block h4 {
    font-size: 0.78rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.08em; color: #888; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .detail-block h4 .icon-input { color: var(--blue); }
  .detail-block h4 .icon-output { color: var(--green-dark); }
  .detail-block ul { list-style: none; }
  .detail-block li {
    padding: 4px 0; font-size: 0.88rem; font-weight: 500; color: #444;
  }
  .detail-block li::before { content: '→  '; font-weight: 800; }
  .role-badge {
    display: inline-block; padding: 2px 10px; border-radius: 6px;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    border: 2px solid var(--border);
  }
  .badge-ai { background: var(--bg-blue); color: var(--blue); }
  .badge-human { background: var(--bg-green); color: var(--green-dark); }
  .tips-block {
    background: var(--bg-yellow); border: var(--border-w) solid var(--border);
    border-radius: var(--radius-sm); padding: 16px;
    box-shadow: 2px 2px 0 var(--border);
    margin-top: 16px;
  }
  .tips-block h4 { font-size: 0.82rem; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
  .tips-block li { font-size: 0.88rem; font-weight: 500; color: #555; padding: 3px 0; }
  .tips-block li::before { content: '💡 '; }

  .tools-block {
    background: var(--bg-card); border: var(--border-w) solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
    box-shadow: 2px 2px 0 var(--border);
    margin-top: 12px;
  }
  .tools-block h4 { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 8px; }

  /* ========== Paradigm Cards ========== */
  .paradigm-list {
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .paradigm-card {
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
    box-shadow: 4px 4px 0 var(--border);
    padding: 24px 28px; cursor: pointer;
    transition: box-shadow 0.25s ease, transform 0.25s ease, background 0.3s ease;
    position: relative;
  }
  .paradigm-card:hover {
    box-shadow: 6px 6px 0 var(--border); transform: translate(-1px,-1px);
  }
  .paradigm-card.expanded {
    background: var(--bg-pink);
    box-shadow: 4px 4px 0 var(--border);
  }
  .paradigm-header {
    display: flex; align-items: center; gap: 16px;
  }
  .paradigm-card .emoji { font-size: 2.4rem; flex-shrink: 0; }
  .paradigm-card .p-info { flex: 1; }
  .paradigm-card .p-name {
    font-size: 1.2rem; font-weight: 800; color: var(--ink);
    margin-bottom: 2px;
  }
  .paradigm-card .p-tagline { font-size: 0.9rem; color: #666; font-weight: 500; }
  .paradigm-card .p-toggle {
    flex-shrink: 0; width: 36px; height: 36px;
    border-radius: 50%; border: var(--border-w) solid var(--border);
    background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  }
  .paradigm-card.expanded .p-toggle {
    transform: rotate(180deg);
    background: var(--yellow);
  }
  .maturity-badge {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
    border: 2px solid var(--border);
    margin-left: 8px; vertical-align: middle;
  }
  .maturity-badge.mainstream { background: var(--bg-green); color: var(--green-dark); }
  .maturity-badge.growing { background: #E0F0FF; color: #1A73E8; }
  .maturity-badge.emerging { background: var(--bg-yellow); color: #B8860B; }
  .paradigm-detail {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    padding-top: 0;
    border-top: var(--border-w) dashed transparent;
    transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.35s ease,
                margin-top 0.35s ease,
                padding-top 0.35s ease,
                border-top-color 0.3s ease;
  }
  .paradigm-card.expanded .paradigm-detail {
    max-height: 800px;
    opacity: 1;
    margin-top: 16px;
    padding-top: 16px;
    border-top-color: var(--border);
  }
  .paradigm-detail p { font-size: 0.9rem; color: #555; font-weight: 500; margin-bottom: 12px; line-height: 1.6; }
  .paradigm-detail h4 { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; color: #888; margin: 10px 0 6px; letter-spacing: 0.05em; }
  .paradigm-detail ul { list-style: none; }
  .paradigm-detail li { font-size: 0.88rem; font-weight: 500; color: #444; padding: 3px 0; }
  .paradigm-detail li::before { content: '✦  '; }
  .tool-chip {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.78rem; font-weight: 700;
    border: 2px solid var(--border); background: var(--bg-base);
    margin: 3px 4px 3px 0; display: inline-block;
  }
  .risk-item { color: var(--red) !important; }
  .risk-item::before { content: '⚠️ ' !important; }

  /* ========== Tool Cards (replacing table for AI Coding Tools) ========== */
  .tool-cards {
    display: flex; flex-direction: column;
    gap: 12px; margin-bottom: 24px;
  }
  .tool-card {
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
    box-shadow: 3px 3px 0 var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .tool-card:hover {
    box-shadow: 5px 5px 0 var(--border);
    transform: translate(-1px, -1px);
  }
  .tool-card-header {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 24px; cursor: pointer;
  }
  .tool-card-icon {
    flex-shrink: 0; width: 44px; height: 44px;
    border-radius: var(--radius-sm); border: var(--border-w) solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 800;
  }
  .tool-card-icon.ide { background: var(--bg-blue); }
  .tool-card-icon.cli { background: var(--bg-green); }
  .tool-card-icon.plugin { background: var(--bg-yellow); }
  .tool-card-info { flex: 1; }
  .tool-card-name {
    font-size: 1.05rem; font-weight: 800; color: var(--ink);
  }
  .tool-card-sub {
    font-size: 0.82rem; color: #888; font-weight: 600;
  }
  .tool-card-stars { font-size: 0.85rem; color: var(--yellow); font-weight: 800; }
  .tool-card-toggle {
    flex-shrink: 0; width: 32px; height: 32px;
    border-radius: 50%; border: var(--border-w) solid var(--border);
    background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 800;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  }
  .tool-card.expanded .tool-card-toggle {
    transform: rotate(180deg);
    background: var(--yellow);
  }
  .tool-card.expanded .tool-card-header {
    background: var(--bg-blue);
  }
  .tool-card-detail {
    overflow: hidden;

          <ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>

}

function toggleStage(card) {
  const wasExpanded = card.classList.contains('expanded');
  document.querySelectorAll('.stage-card.expanded').forEach(c => {
    if (c !== card) c.classList.remove('expanded');
    c.style.removeProperty('--spot-color');
  });
  card.classList.toggle('expanded', !wasExpanded);
  if (!wasExpanded) {
    // Set spotlight color based on dot color
    const dot = card.querySelector('.stage-dot');
    const colorMap = {
      green: '82,196,26',
      blue: '77,171,247',
      yellow: '255,217,61',
      red: '250,82,82'
    };
    let rgb = '82,196,26';
    if (dot) {
      for (const [cls, val] of Object.entries(colorMap)) {
        if (dot.classList.contains(cls)) { rgb = val; break; }
      }
    }
    card.style.setProperty('--spot-color', rgb);
  } else {
    card.style.removeProperty('--spot-color');
  }
}

        <h4>代表工具</h4>
        <div>${(p.tools||[]).map(t=>`<span class="tool-chip">${t}</span>`).join('')}</div>
        <h4>风险</h4>
        <ul>${(p.risks||[]).map(x=>`<li class="risk-item">${x}</li>`).join('')}</ul>
      </div>
    </div>
  `).join('');
}

function toggleParadigm(card) {
  const wasExpanded = card.classList.contains('expanded');
  // close all other cards first (accordion)
  document.querySelectorAll('.paradigm-card.expanded').forEach(c => {
    if (c !== card) c.classList.remove('expanded');
  });
  if (!wasExpanded) {
    card.classList.add('expanded');
  } else {
    card.classList.remove('expanded');
  }
}

function renderToolchain() {
  const c = document.getElementById('toolchain-container');
  let html = '';
  WORKFLOW_DATA.toolchain.categories.forEach((cat) => {
    html += `<h3 style="font-size:1.1rem;font-weight:800;margin:24px 0 12px;color:#2C2C2C;">${cat.name}</h3>`;
    html += '<div class="tool-cards">';
    cat.items.forEach(item => {
      const bp = TOOL_BEST_PRACTICES[item.name];
      const iconClass = bp ? bp.iconClass : 'ide';
      const icon = bp ? bp.icon : '🔧';
      html += `
        <div class="tool-card" onclick="toggleTool(this)">
          <div class="tool-card-header">
            <div class="tool-card-icon ${iconClass}">${icon}</div>
            <div class="tool-card-info">
              <div class="tool-card-name">${item.name}</div>
              <div class="tool-card-sub">${item.type} · ${item.pricing}</div>
            </div>
            <div class="tool-card-stars">${item.recommendation}</div>
            <div class="tool-card-toggle">▾</div>
          </div>
          <div class="tool-card-detail" onclick="event.stopPropagation()">
            ${bp ? `
              <span class="best-practice-tag">💡 最佳实践</span>
              <ul>${bp.practices.map(p=>`<li>${p}</li>`).join('')}</ul>
              <h4>进阶技巧</h4>
              <ul>${bp.advancedTips.map(p=>`<li>${p}</li>`).join('')}</ul>
              <h4>了解更多</h4>
              <a class="tool-link" href="${bp.sourceUrl}" target="_blank" rel="noopener">${bp.sourceTitle} ↗</a>
              <span style="margin:0 8px;color:#ccc;">|</span>
              <a class="tool-link" href="${bp.url}" target="_blank" rel="noopener">官方站点 ↗</a>
            ` : `
              <p style="font-size:0.9rem;color:#666;font-weight:500;">${item.strength}</p>
            `}
          </div>
        </div>`;
    });
    html += '</div>';
  });
  c.innerHTML = html;
}

function toggleTool(card) {
  const wasExpanded = card.classList.contains('expanded');
  document.querySelectorAll('.tool-card.expanded').forEach(c => {
    if (c !== card) c.classList.remove('expanded');
  });
  card.classList.toggle('expanded', !wasExpanded);
}

// ========== Feed ==========
let activeFilter = 'all';
function renderFeed(filter='all', search='') {
  let items = WORKFLOW_DATA.feed;
  if (filter!=='all') items = items.filter(f => (f.tags||[]).some(t => t.includes(filter)));
  if (search) {
    const s = search.toLowerCase();
    items = items.filter(f =>
      (f.title||'').toLowerCase().includes(s) ||
      (f.summary||'').toLowerCase().includes(s)
    );
  }
  const c = document.getElementById('feed-container');
  c.innerHTML = items.length ? items.map(f => `
    <a class="feed-item" href="${f.url||'#'}" target="_blank" rel="noopener">
      <div class="feed-meta">
        <span class="feed-platform pf-${f.platform.toLowerCase().replace('/','')}">${f.platform}</span>
        <span class="feed-author">${f.author||''}</span>
        <span class="feed-date">${f.date||''}</span>
      </div>
      <h3>${f.title||''}<span class="external-arrow">↗</span></h3>
      <div class="summary">${f.summary||''}</div>
      <div class="feed-tags">${(f.tags||[]).map(t=>`<span class="feed-tag">${t}</span>`).join('')}</div>
    </a>
  `).join('') : '<p style="color:#999;padding:20px;text-align:center;font-weight:700;">没有匹配的结果</p>';
}
function renderFeedFilters() {
  const filters = ['all','🔧工具','📋方法论','💡案例','⚡新闻'];
  document.getElementById('feed-filters').innerHTML = filters.map(f => `
    <button class="filter-btn ${f==='all'?'active':''}" onclick="setFilter('${f}',this)">${f==='all'?'全部':f}</button>
  `).join('');
}
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed(f, document.getElementById('feed-search').value);
}
document.getElementById('feed-search').addEventListener('input', function(){
  renderFeed(activeFilter, this.value);
});

// Badge
document.getElementById('feed-count').textContent = (WORKFLOW_DATA.feed||[]).length;

// Nav scroll
document.querySelectorAll('.topbar-link').forEach(a => {
  a.addEventListener('click', function(e){
    e.preventDefault();
    const t = document.querySelector(this.getAttribute('href'));
    if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('.topbar-link').forEach(l=>l.classList.remove('active'));
    this.classList.add('active');
  });
});

renderPipeline();
renderParadigms();
renderToolchain();
renderFeedFilters();
renderFeed();

setTimeout(()=>{
  const first = document.querySelector('.stage-card');
  if(first) first.classList.add('expanded');
}, 600);
</script>
