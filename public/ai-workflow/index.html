<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 时代开发工作流</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Baloo 2', 'Noto Sans SC', sans-serif;
    background: #FFF9F0;
    color: #2C2C2C;
    min-height: 100vh;
  }
  .hero {
    text-align: center; padding: 80px 20px 20px;
    position: relative;
  }
  .hero h1 {
    font-size: 2.8rem; font-weight: 800; color: #2C2C2C;
    letter-spacing: -0.03em;
  }
  .hero h1 .hl {
    background: #FFD93D; padding: 0 10px;
    border: 3px solid #2C2C2C; border-radius: 10px;
    display: inline-block;
  }
  .hero p {
    font-size: 1.1rem; color: #666; font-weight: 500;
    margin-top: 12px;
  }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px; max-width: 900px; margin: 48px auto; padding: 0 20px;
  }
  .card {
    border: 3px solid #2C2C2C; border-radius: 16px;
    padding: 32px 24px; text-decoration: none; color: inherit;
    transition: all 0.2s; background: #fff;
    box-shadow: 4px 4px 0 #2C2C2C;
  }
  .card:hover {
    box-shadow: 6px 6px 0 #2C2C2C;
    transform: translate(-1px, -1px);
  }
  .card .icon { font-size: 2.4rem; margin-bottom: 16px; display: block; }
  .card h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
  .card p { font-size: 0.9rem; color: #666; font-weight: 500; line-height: 1.5; }
  .card .tag {
    display: inline-block; margin-top: 16px;
    padding: 4px 14px; border-radius: 20px;
    font-size: 0.78rem; font-weight: 800;
    border: 2px solid #2C2C2C; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card.g .tag { background: #F0FFF4; color: #237804; }
  .card.l .tag { background: #F0F8FF; color: #1A73E8; }
  .card.g { background: #FEFEFE; }
  .card.l { background: #F8FBFF; }
  .version-label {
    font-size: 0.7rem; font-weight: 800;
    color: #999; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 8px;
  }
  .footer {
    text-align: center; padding: 32px;
    font-size: 0.85rem; color: #999; font-weight: 600;
    border-top: 3px solid #2C2C2C;
    box-shadow: 0 -3px 0 #2C2C2C;
    background: #FFF9F0;
  }
  @media (max-width: 700px) {
    .hero h1 { font-size: 2rem; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="hero">
    <h1><span class="hl">Agentic</span> 开发工作流</h1>
    <p>持续追踪业界最佳实践 · 自动整合一线工程师分享 · 数据与视图分离</p>
  </div>
  <div class="cards">
    <a class="card g" href="global/index.html">
      <div class="version-label">Global</div>
      <span class="icon">🌍</span>
      <h2>Global 工作流</h2>
      <p>追踪业内一流的 Agentic 开发方法论与工具链集成，含开发管线、范式图谱、工具链选型与信息流。</p>
      <span class="tag">业界最佳实践</span>
    </a>
    <a class="card l" href="local/index.html">
      <div class="version-label">Project Custom</div>
      <span class="icon">🎯</span>
      <h2>Local 工作流</h2>
      <p>基于 Global 版定制，叠加项目特定的工具配置、团队约定、kimi-webbridge 工程化实践和定制化工作流。</p>
      <span class="tag">项目定制版</span>
    </a>
  </div>
  <div class="footer">
    <p>最后更新：2026-06-05 · 自动同步来自 X / Reddit / Medium / HackerNews 的一线实践</p>
  </div>
</body>
</html>
